# Hooky - Ergonomic Tmux Theme
# https://github.com/abstraction/hooky

# Enable truecolor support
set -ag terminal-overrides ",*:RGB"

# Status bar styling
set -g status-style "bg=#141312,fg=#cfc6b8"
set -g status-left "#[fg=#191716,bg=#e59458,bold] #S #[bg=#141312,fg=#e59458] "
set -g status-right "#[fg=#e59458]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#9b948a]#h "

# Window status
set -g window-status-separator ""
set -g window-status-format "#[fg=#9b948a,bg=#141312] #I:#W "
set -g window-status-current-format "#[fg=#e59458,bg=#221f1d,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#2a2725"
set -g pane-active-border-style "fg=#e59458"

# Command line / messages
set -g message-style "bg=#221f1d,fg=#e59458"
set -g message-command-style "bg=#221f1d,fg=#e59458"

# Selection / Copy mode
set -g mode-style "bg=#3a3430,fg=#cfc6b8"

# Clock
setw -g clock-mode-colour "#e59458"
