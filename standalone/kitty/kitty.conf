# Hooky - Ergonomic Color Scheme for Kitty
# https://github.com/abstraction/hooky
#
# Typography Optimization:
# 'text_composition_strategy platform' disables legacy alpha edge erosion,
# restoring true stroke weight and solid glyph bodies on dark backgrounds.
text_composition_strategy platform

# Special colors
foreground            #cfc6b8
background            #191716
selection_foreground  #cfc6b8
selection_background  #3a3430

# Cursor colors
cursor                #cfc6b8
cursor_text_color     #191716

# URL underline color when hovering with mouse
url_color             #6eb3c2

# Kitty window border colors
active_border_color   #e59458
inactive_border_color #2a2725
bell_border_color     #dc7468

# Tab bar colors
active_tab_foreground   #191716
active_tab_background   #e59458
inactive_tab_foreground #9b948a
inactive_tab_background #141312
tab_bar_background      #141312

# Standard ANSI colors
# Black
color0 #191716
color8 #9b948a

# Red
color1 #dc7468
color9 #dc7468

# Green
color2  #a3b26c
color10 #a3b26c

# Yellow
color3  #d8a657
color11 #d8a657

# Blue (Slate spruce cyan; low chroma C < 0.10)
color4  #6eb3c2
color12 #6eb3c2

# Magenta
color5  #cc8292
color13 #cc8292

# Cyan
color6  #88b29e
color14 #88b29e

# White (Warm cream; matches foreground to prevent cursor/selection glare)
color7  #cfc6b8
color15 #cfc6b8
